<#</script>
<script>
(function () {
  var root = document.documentElement, sw = document.getElementById('themeSwitch');
  var pm = document.getElementById('previewMode');
  function set(t) {
    root.setAttribute('data-theme', t); sw.setAttribute('aria-checked', t === 'dark' ? 'true' : 'false');
    if (pm) { pm.textContent = t === 'dark' ? 'Dark' : 'Light'; }
    var m = document.querySelector('meta[name=theme-color]'); if (m) { m.setAttribute('content', t === 'dark' ? '#15171c' : '#f3f4f7'); }
  }
  var saved = null; try { saved = localStorage.getItem('itk-theme'); } catch (e) {}
  set(saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  sw.addEventListener('click', function () {
    var t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; set(t);
    try { localStorage.setItem('itk-theme', t); } catch (e) {}
  });
  document.querySelectorAll('[data-copy]').forEach(function (b) {
    b.addEventListener('click', function () {
      var text = b.getAttribute('data-copy');
      var label = b.querySelector('span') || b;
      var done = function () { label.textContent = 'Copied'; setTimeout(function () { label.textContent = 'Copy'; }, 1600); };
      if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, done); } else { done(); }
    });
  });
  // strip the PowerShell comment markers around the script (built from two halves so this file stays valid PowerShell)
  var close = '#' + '>', open = '<' + '#';
  var src = document.getElementById('ps').textContent.trim();
  if (src.indexOf(close) === 0) { src = src.slice(close.length); }
  if (src.slice(-open.length) === open) { src = src.slice(0, -open.length); }
  src = src.trim();
  document.getElementById('psView').textContent = src;
})();
</script>
</body></html> #>
