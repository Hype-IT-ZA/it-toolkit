name: Feature request
description: Suggest a tool, app, tweak or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to be able to do?
      description: Describe the job you are trying to get done on a PC.
      placeholder: Reset the Windows Store cache for the signed-in user without opening a console.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where would it go?
      options:
        - Tools tab
        - Install tab (new app)
        - Tweaks tab
        - Updates tab
        - Headless / command line
        - Not sure
  - type: textarea
    id: how
    attributes:
      label: How do you do it today? (optional)
      description: Commands, settings or apps you use now. PowerShell snippets are very welcome.
      render: powershell
