# Publishes the installer to GitHub Pages so the short command works:
#   irm hype-it-za.github.io/it-toolkit | iex
# index.html is a web page AND a PowerShell script: site/head.html + install.ps1 + site/tail.html.
# The page parts sit inside PowerShell <# ... #> comments, so iex runs only install.ps1,
# while a browser shows the landing page. /install.ps1 is also published as plain text.
name: Publish installer to GitHub Pages

on:
  push:
    branches: [main]
    paths: [install.ps1, version.txt, 'site/**', .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          version="$(tr -d '[:space:]' < version.txt)"
          sed "s/{{VERSION}}/${version}/g" site/head.html > _site/index.html
          cat install.ps1 >> _site/index.html
          printf '\n' >> _site/index.html
          cat site/tail.html >> _site/index.html
          cp install.ps1 _site/install.ps1
          touch _site/.nojekyll
          # Safety check: the page parts must not close the PowerShell comment early
          test "$(grep -o '#>' site/head.html | wc -l)" -eq 1
          test "$(grep -o '#>' site/tail.html | wc -l)" -eq 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
