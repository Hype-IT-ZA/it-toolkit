# Publishes install.ps1 to GitHub Pages so the short command works:
#   irm hype-it-za.github.io/it-toolkit | iex
name: Publish installer to GitHub Pages

on:
  push:
    branches: [main]
    paths: [install.ps1, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp install.ps1 _site/index.html
          cp install.ps1 _site/install.ps1
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
